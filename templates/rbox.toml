# rbox per-project resource caps.
# Applies to commands run via `rbox <cmd>`. Host is 10 cpu / 24GB,
# but the OrbStack VM ceiling is 10 cpu / 12GB - stay under that.

cpus   = 4        # hard CPU cap (cgroup v2 cpu.max)
memory = "6g"     # hard RAM cap; exceeding it OOM-kills with exit 137
pids   = 512      # fork-bomb guard
image  = "rbox:local"

# true  = mount node_modules as a named volume (~3.9x faster small-file I/O)
#         but it is NOT synced back to the host, so your IDE won't see it.
# false = plain bind mount, fully visible on the host. Default.
isolate_node_modules = false

# ---------------------------------------------------------------------------
# Custom toolchains (Lean, Rust, Go, ...)
#
# Your macOS binaries cannot be reused: the sandbox runs Linux, so Mach-O
# executables fail with "Exec format error". Install the Linux build inside the
# container instead, and cache it in a named volume.
#
#   volumes = ["elan:/root/.elan"]     # persists across `rbox rm`
#   env     = ["PATH=/root/.elan/bin:/usr/local/bin:/usr/bin:/bin"]
#   setup   = "curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y"
#
# `setup` runs once per container; re-run it with `rbox setup`.
# Ready-made recipes: examples/ in the ai-cgroup repo.
# ---------------------------------------------------------------------------
